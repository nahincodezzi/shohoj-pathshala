<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad_chormohona" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow_chormohona" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#grad_chormohona)" filter="url(#shadow_chormohona)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="100" cy="100" r="72" fill="#ffffff" opacity="0.08"/>
  
  <!-- Central Emblem: Open Book & Rising Sun Motif -->
  <g transform="translate(100, 95) scale(0.9)">
    <!-- Sun Rays -->
    <path d="M-40 -20 Q0 -50 40 -20 Q0 -35 -40 -20" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="-25" r="16" fill="#f59e0b"/>
    <!-- Open Book -->
    <path d="M0 10 C-15 -5 -40 -5 -50 5 L-50 25 C-40 15 -15 15 0 28 C15 15 40 15 50 25 L50 5 C40 -5 15 -5 0 10 Z" fill="#ffffff"/>
    <line x1="0" y1="12" x2="0" y2="30" stroke="#064e3b" stroke-width="2"/>
    <!-- Torch flame / pen tip -->
    <path d="M-4 -12 Q0 -30 4 -12 Q0 -2 -4 -12" fill="#ef4444"/>
  </g>
  
  <!-- Est Year & School Prefix -->
  <text x="100" y="160" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    স্থাপিত: ২০০১
  </text>
  <text x="100" y="42" font-family="sans-serif" font-weight="800" font-size="14" fill="#f59e0b" text-anchor="middle" letter-spacing="2">
    CMHS
  </text>
</svg>